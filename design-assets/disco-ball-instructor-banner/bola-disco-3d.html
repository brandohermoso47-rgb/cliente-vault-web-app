<style>
  html,body{margin:0;height:100%;background:#0A0A0C}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<three-d-stage name="bola-disco" background="#0A0A0C" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
  import { buildDiscoBall } from './disco-ball-model.js';
  const stage = document.querySelector('three-d-stage');
  const { THREE } = await stage.ready;
  stage.setObject(buildDiscoBall(THREE));
