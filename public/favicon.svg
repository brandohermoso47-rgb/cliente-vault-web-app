<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="platinumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="chromeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#e9c349"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#platinumBg)"/>
  <!-- Metallic Ring Outer -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#chromeGlow)" stroke-width="18" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#e9c349" stroke-width="4" stroke-opacity="0.4"/>
  <!-- Monogram W / ON Silhouette -->
  <path d="M 140 180 L 190 340 L 256 220 L 322 340 L 372 180" fill="none" stroke="url(#chromeGlow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ON Power Circle Dot -->
  <circle cx="256" cy="180" r="16" fill="#e9c349"/>
</svg>
